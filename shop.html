    <style>
* {
  box-sizing: border-box;
}

:root {
  --void: #070712;
  --deep: #0d0b23;
  --violet: #8b5cf6;
  --fuchsia: #f0abfc;
  --cyan: #67e8f9;
  --solar: #fde68a;
  --rose: #fb7185;
  --ink: rgba(255, 255, 255, 0.92);
  --muted: rgba(226, 232, 240, 0.72);
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at 18% 12%, rgba(139, 92, 246, 0.28), transparent 34rem),
    radial-gradient(circle at 80% 18%, rgba(34, 211, 238, 0.2), transparent 30rem),
    linear-gradient(180deg, #070712 0%, #0d0b23 52%, #120817 100%);
  color: #fff;
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    "PingFang SC", "Microsoft YaHei", sans-serif;
}

.page-shell {
  position: relative;
  min-height: 100vh;
}

.site-header {
  position: fixed;
  left: 50%;
  top: 1rem;
  z-index: 10;
  display: flex;
  width: min(calc(100% - 2rem), 76rem);
  transform: translateX(-50%);
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 999px;
  background: rgba(7, 7, 18, 0.64);
  padding: 0.55rem 0.7rem 0.55rem 0.55rem;
  backdrop-filter: blur(20px);
}

.brand-mark,
.site-header nav,
.site-header nav a {
  display: flex;
  align-items: center;
}

.brand-mark {
  gap: 0.7rem;
  color: #fff;
  text-decoration: none;
}

.brand-mark span {
  display: grid;
  width: 2.35rem;
  height: 2.35rem;
  place-items: center;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 25%, #fff, var(--cyan) 30%, var(--violet) 72%);
  color: #09091a;
  font-size: 0.78rem;
  font-weight: 950;
}

.brand-mark strong {
  font-size: 0.95rem;
}

.site-header nav {
  gap: 0.25rem;
}

.site-header nav a {
  min-height: 2.1rem;
  border-radius: 999px;
  padding: 0 0.85rem;
  color: rgba(255, 255, 255, 0.72);
  font-size: 0.86rem;
  text-decoration: none;
}

.site-header nav a:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}

::selection {
  background: rgba(103, 232, 249, 0.35);
}

main {
  min-height: 100vh;
  overflow: hidden;
}

.hero {
  position: relative;
  isolation: isolate;
  display: flex;
  min-height: 100vh;
  align-items: center;
  padding: 2.5rem 4rem;
}

.hero-grid,
.cards-section {
  width: min(100%, 80rem);
  margin: 0 auto;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.08fr 0.92fr;
  align-items: center;
  gap: 2.5rem;
}

.eyebrow {
  display: inline-flex;
  margin: 0 0 1.25rem;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  padding: 0.5rem 1rem;
  color: rgba(207, 250, 254, 0.8);
  font-size: 0.75rem;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  box-shadow: 0 0 40px rgba(34, 211, 238, 0.18);
  backdrop-filter: blur(16px);
}

h1 {
  max-width: 58rem;
  margin: 0;
  color: #fff;
  font-size: clamp(3.4rem, 8.5vw, 6rem);
  font-weight: 950;
  letter-spacing: -0.035em;
  line-height: 0.9;
  text-wrap: balance;
}

h1 span {
  display: block;
  padding-bottom: 0.2em;
  color: var(--cyan);
  text-shadow: 0 0 34px rgba(103, 232, 249, 0.34);
}

.intro {
  max-width: 42rem;
  margin: 1.75rem 0 0;
  color: rgba(226, 232, 240, 0.78);
  font-size: clamp(1.05rem, 2vw, 1.25rem);
  line-height: 1.8;
  text-wrap: pretty;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  margin-top: 2.25rem;
}

.actions a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  padding: 0.9rem 1.4rem;
  font-size: 0.92rem;
  font-weight: 750;
  text-decoration: none;
  transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
}

.actions a:hover {
  transform: translateY(-0.25rem);
}

.primary {
  background: #fff;
  color: #111125;
  box-shadow: 0 18px 70px rgba(255, 255, 255, 0.22);
}

.primary:hover {
  box-shadow: 0 26px 90px rgba(56, 189, 248, 0.35);
}

.primary span {
  margin-left: 0.5rem;
}

.secondary {
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.07);
  color: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(16px);
}

.secondary:hover {
  border-color: rgba(165, 243, 252, 0.5);
}

.shop-link span {
  margin-left: 0.5rem;
  color: var(--solar);
  font-size: 1.1rem;
}

.aurora {
  position: absolute;
  z-index: -1;
  pointer-events: none;
  border-radius: 999px;
  filter: blur(24px);
  opacity: 0.76;
  mix-blend-mode: screen;
  animation: drift 14s ease-in-out infinite alternate;
}

.aurora-one {
  left: -10rem;
  top: 8rem;
  width: 34rem;
  height: 34rem;
  background: rgba(168, 85, 247, 0.42);
}

.aurora-two {
  right: -14rem;
  top: 2rem;
  width: 38rem;
  height: 38rem;
  background: rgba(6, 182, 212, 0.33);
  animation-delay: -4s;
}

.aurora-three {
  bottom: -18rem;
  left: 28%;
  width: 42rem;
  height: 42rem;
  background: rgba(251, 191, 36, 0.2);
  animation-delay: -8s;
}

.starfield span {
  position: absolute;
  display: block;
  border-radius: 999px;
  background: #fff;
  box-shadow: 0 0 18px rgba(255, 255, 255, 0.9);
  opacity: 0.28;
  animation: twinkle 3.8s ease-in-out infinite;
}

.planet-wrap {
  position: relative;
  aspect-ratio: 1;
  width: min(100%, 35rem);
  margin: 0 auto;
}

.planet-shell {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
}

.planet-core {
  position: relative;
  width: min(78vw, 25rem);
  height: min(78vw, 25rem);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 40% 60% 58% 42% / 46% 38% 62% 54%;
  background:
    radial-gradient(circle at 34% 26%, rgba(255, 255, 255, 0.92), transparent 0.55rem),
    radial-gradient(circle at 38% 32%, rgba(103, 232, 249, 0.62), transparent 4rem),
    radial-gradient(circle at 68% 66%, rgba(240, 171, 252, 0.62), transparent 7rem),
    linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.035));
  box-shadow:
    inset 0 0 70px rgba(255, 255, 255, 0.11),
    0 0 95px rgba(103, 232, 249, 0.28),
    0 0 150px rgba(217, 70, 239, 0.18);
  animation: morph 10s ease-in-out infinite alternate;
}

.planet-core::before {
  position: absolute;
  inset: 10%;
  content: "";
  border-radius: inherit;
  background:
    linear-gradient(110deg, transparent 0 28%, rgba(255, 255, 255, 0.22) 31%, transparent 36% 54%, rgba(255, 255, 255, 0.12) 58%, transparent 64%),
    repeating-linear-gradient(130deg, rgba(255, 255, 255, 0.08) 0 1px, transparent 1px 17px);
  opacity: 0.72;
}

.orbit {
  position: absolute;
  inset: 9%;
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 50%;
  transform: rotateX(64deg) rotateZ(-18deg);
  box-shadow: 0 0 42px rgba(103, 232, 249, 0.12);
}

.orbit-a {
  animation: spin 17s linear infinite;
}

.orbit-b {
  inset: 4%;
  border-color: rgba(240, 171, 252, 0.26);
  transform: rotateX(68deg) rotateZ(28deg);
  animation: spin 23s linear infinite reverse;
}

.orbit-c {
  inset: 16%;
  border-style: dashed;
  border-color: rgba(253, 230, 138, 0.22);
  transform: rotateX(62deg) rotateZ(58deg);
  animation: spin 29s linear infinite;
}

.glass-card {
  position: absolute;
  z-index: 2;
  width: 15rem;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 1.35rem;
  background: rgba(8, 10, 26, 0.48);
  padding: 1rem 1.1rem;
  color: rgba(255, 255, 255, 0.9);
  box-shadow: 0 20px 80px rgba(0, 0, 0, 0.28);
  backdrop-filter: blur(18px);
}

.glass-card small {
  color: rgba(207, 250, 254, 0.7);
  font-size: 0.72rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
}

.glass-card strong {
  display: block;
  margin-top: 0.35rem;
  font-size: 1rem;
  letter-spacing: -0.03em;
}

.card-top {
  right: -2rem;
  top: 3.4rem;
}

.card-bottom {
  bottom: 3.6rem;
  left: -2.5rem;
}

.cards-section {
  position: relative;
  z-index: 1;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  padding: 4rem 4rem 5rem;
}

.mood-strip {
  display: grid;
  width: min(calc(100% - 3rem), 80rem);
  margin: -3rem auto 0;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 1.5rem;
  background: rgba(255, 255, 255, 0.12);
}

.mood-strip div {
  min-height: 10rem;
  background:
    radial-gradient(circle at 70% 15%, rgba(103, 232, 249, 0.16), transparent 45%),
    rgba(7, 7, 18, 0.74);
  padding: 1.25rem;
}

.mood-strip span {
  color: var(--solar);
  font-size: 0.78rem;
  font-weight: 900;
}

.mood-strip strong {
  display: block;
  margin-top: 1.6rem;
  color: #fff;
  font-size: clamp(1.35rem, 2.4vw, 2rem);
  letter-spacing: -0.04em;
}

.mood-strip p {
  max-width: 20rem;
  margin: 0.65rem 0 0;
  color: var(--muted);
  line-height: 1.65;
}

.gallery-section {
  width: min(100%, 80rem);
  margin: 0 auto;
  padding: 7rem 4rem 3rem;
}

.section-heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 2rem;
  margin-bottom: 2rem;
}

.section-heading p {
  max-width: 18rem;
  margin: 0;
  color: var(--muted);
  line-height: 1.7;
}

.section-heading h2 {
  max-width: 42rem;
  color: #fff;
  font-size: clamp(2.4rem, 6vw, 5.4rem);
  line-height: 0.95;
  text-align: right;
  text-wrap: balance;
}

.gallery-grid {
  display: grid;
  grid-template-columns: 1.1fr 0.85fr 1fr;
  grid-auto-rows: 13rem;
  gap: 1rem;
}

.photo-card {
  position: relative;
  overflow: hidden;
  margin: 0;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 1.25rem;
  background: rgba(255, 255, 255, 0.06);
}

.photo-card.tall {
  grid-row: span 2;
}

.photo-card.wide {
  grid-column: span 2;
}

.photo-gradient {
  position: absolute;
  inset: 0;
}

.g1 {
  background:
    radial-gradient(circle at 35% 28%, rgba(255, 255, 255, 0.72), transparent 0.5rem),
    radial-gradient(circle at 50% 38%, rgba(103, 232, 249, 0.72), transparent 7rem),
    linear-gradient(140deg, #111827, #581c87 58%, #0e7490);
}

.g2 {
  background:
    radial-gradient(circle at 80% 20%, rgba(253, 230, 138, 0.8), transparent 4rem),
    linear-gradient(145deg, #312e81, #be185d);
}

.g3 {
  background:
    radial-gradient(circle at 25% 40%, rgba(251, 113, 133, 0.72), transparent 7rem),
    radial-gradient(circle at 72% 35%, rgba(103, 232, 249, 0.64), transparent 9rem),
    linear-gradient(100deg, #020617, #312e81 58%, #111827);
}

.g4 {
  background:
    radial-gradient(circle at 45% 25%, rgba(240, 171, 252, 0.7), transparent 5rem),
    linear-gradient(155deg, #0f172a, #7c2d12);
}

.photo-card figcaption {
  position: absolute;
  left: 1rem;
  bottom: 1rem;
  border-radius: 999px;
  background: rgba(7, 7, 18, 0.56);
  padding: 0.5rem 0.8rem;
  color: #fff;
  font-size: 0.86rem;
  backdrop-filter: blur(14px);
}

.identity-section {
  position: relative;
  display: grid;
  width: min(calc(100% - 3rem), 80rem);
  margin: 3rem auto 0;
  grid-template-columns: minmax(18rem, 0.8fr) minmax(0, 1.2fr);
  gap: clamp(1.5rem, 4vw, 4rem);
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 1.5rem;
  background:
    radial-gradient(circle at 18% 35%, rgba(251, 113, 133, 0.18), transparent 18rem),
    radial-gradient(circle at 88% 20%, rgba(103, 232, 249, 0.14), transparent 20rem),
    rgba(255, 255, 255, 0.045);
  padding: clamp(1.5rem, 4vw, 3rem);
}

.identity-orb {
  position: relative;
  display: grid;
  min-height: 24rem;
  place-items: center;
  border-radius: 1.25rem;
  background:
    radial-gradient(circle at 50% 45%, rgba(253, 230, 138, 0.3), transparent 7rem),
    linear-gradient(155deg, rgba(103, 232, 249, 0.1), rgba(240, 171, 252, 0.08));
  isolation: isolate;
}

.identity-orb::before,
.identity-orb::after {
  position: absolute;
  content: "";
  border-radius: 999px;
}

.identity-orb::before {
  width: 17rem;
  height: 17rem;
  border: 1px solid rgba(255, 255, 255, 0.16);
  background:
    radial-gradient(circle at 36% 26%, rgba(255, 255, 255, 0.9), transparent 0.5rem),
    radial-gradient(circle at 58% 42%, rgba(103, 232, 249, 0.66), transparent 4rem),
    radial-gradient(circle at 38% 70%, rgba(251, 113, 133, 0.62), transparent 6rem),
    #12122c;
  box-shadow: 0 0 120px rgba(103, 232, 249, 0.26);
}

.identity-orb::after {
  width: 22rem;
  height: 7rem;
  border: 1px solid rgba(253, 230, 138, 0.28);
  transform: rotate(-17deg);
}

.identity-orb span,
.identity-orb strong {
  position: relative;
  z-index: 1;
}

.identity-orb span {
  align-self: end;
  color: rgba(255, 255, 255, 0.62);
  font-size: 0.8rem;
  letter-spacing: 0.48em;
}

.identity-orb strong {
  align-self: start;
  color: #fff;
  font-size: clamp(4rem, 9vw, 8rem);
  line-height: 0.9;
  letter-spacing: -0.04em;
  text-shadow: 0 0 42px rgba(103, 232, 249, 0.52);
}

.identity-orb i {
  position: absolute;
  right: 17%;
  bottom: 19%;
  width: 0.7rem;
  height: 0.7rem;
  border-radius: 999px;
  background: var(--solar);
  box-shadow: 0 0 36px rgba(253, 230, 138, 0.8);
}

.identity-copy {
  align-self: center;
}

.identity-copy h2 {
  max-width: 40rem;
  color: #fff;
  font-size: clamp(2.2rem, 5vw, 4.8rem);
  line-height: 1;
  letter-spacing: -0.04em;
  text-wrap: balance;
}

.identity-copy > p:not(.eyebrow) {
  max-width: 42rem;
  margin: 1.35rem 0 0;
  color: var(--muted);
  font-size: 1.08rem;
  line-height: 1.85;
}

.mini-log {
  display: flex;
  flex-wrap: wrap;
  gap: 0.7rem;
  margin-top: 1.6rem;
}

.mini-log span {
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.07);
  padding: 0.65rem 0.9rem;
  color: rgba(255, 255, 255, 0.82);
  font-size: 0.9rem;
}

.signal-board {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(18rem, 0.52fr);
  gap: 1.25rem;
  margin-bottom: 1.25rem;
}

.signal-copy,
.cassette {
  min-height: 19rem;
  border-radius: 1.25rem;
}

.signal-copy {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  border: 1px solid rgba(103, 232, 249, 0.18);
  background:
    radial-gradient(circle at 20% 24%, rgba(103, 232, 249, 0.22), transparent 16rem),
    radial-gradient(circle at 78% 42%, rgba(240, 171, 252, 0.18), transparent 18rem),
    rgba(255, 255, 255, 0.05);
  padding: clamp(1.4rem, 3vw, 2.2rem);
}

.signal-copy p {
  margin: 0 0 0.8rem;
  color: var(--solar);
  font-size: 0.9rem;
  font-weight: 850;
}

.signal-copy h2 {
  max-width: 45rem;
  color: #fff;
  font-size: clamp(2.4rem, 6vw, 5.2rem);
  line-height: 0.95;
  letter-spacing: -0.04em;
}

.signal-copy span {
  display: block;
  max-width: 45rem;
  margin-top: 1.2rem;
  color: var(--muted);
  line-height: 1.8;
}

.cassette {
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(253, 230, 138, 0.2);
  background:
    radial-gradient(circle at 50% 42%, rgba(253, 230, 138, 0.18), transparent 10rem),
    linear-gradient(145deg, rgba(251, 113, 133, 0.14), rgba(103, 232, 249, 0.08)),
    rgba(255, 255, 255, 0.045);
  padding: 1.35rem;
}

.cassette-top {
  height: 3.2rem;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 0.85rem;
  background: rgba(7, 7, 18, 0.4);
}

.cassette-reels {
  display: flex;
  justify-content: space-between;
  gap: 1.5rem;
  margin: 2rem 1rem 0;
}

.cassette-reels i {
  display: block;
  width: min(34vw, 6.5rem);
  aspect-ratio: 1;
  border: 1.1rem solid rgba(255, 255, 255, 0.16);
  border-radius: 999px;
  background:
    radial-gradient(circle, rgba(7, 7, 18, 0.9) 0 0.65rem, transparent 0.7rem),
    conic-gradient(from 20deg, var(--cyan), var(--fuchsia), var(--solar), var(--cyan));
  box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
}

.cassette strong {
  position: absolute;
  left: 1.35rem;
  bottom: 1.25rem;
  color: rgba(255, 255, 255, 0.78);
  font-size: 0.9rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.25rem;
}

article,
.statement {
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.055);
  box-shadow: 0 18px 80px rgba(0, 0, 0, 0.26);
  backdrop-filter: blur(18px);
}

article {
  border-radius: 1.25rem;
  padding: 1.75rem;
  transition: transform 260ms ease, border-color 260ms ease, background 260ms ease;
}

article:hover {
  transform: translateY(-0.5rem);
  border-color: rgba(165, 243, 252, 0.35);
  background: rgba(255, 255, 255, 0.085);
}

.bar {
  width: 4rem;
  height: 0.5rem;
  margin-bottom: 2rem;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--cyan), var(--fuchsia), var(--solar));

    <script>
      document.querySelector("#order-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(event.currentTarget));
        const order = { ...data, id: `NM${Date.now().toString().slice(-8)}`, createdAt: new Date().toISOString(), status: "待人工确认" };
        localStorage.setItem("neonme-last-order", JSON.stringify(order));
        document.querySelector("#order-id").textContent = order.id;
        document.querySelector("#order-result").hidden = false;
        event.currentTarget.hidden = true;
      });
